[project]
name = "vighnaharta-receipts"
version = "0.1.0"
description = "Paperless donation e-receipt system for Dadar Cha Vighnaharta Ganpati Mandal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit",
    "fpdf2",
    "gspread",
    "google-auth",
    "google-auth-oauthlib",
    "python-dotenv",
    "requests",
    "pillow",
    "uharfbuzz>=0.55.0",
    "pymupdf>=1.28.0",
    "reportlab>=5.0.0",
    "pypdf>=6.14.2",
]
